# ==============================================================================
# Author: Falah Jabar
# Affiliation: University Hospital of North Norway (UNN)
# Project: Machine Learning-Based Toxicity Prediction
#
# Stage M2: "Severe toxicity" screen (Grade >= 3 vs Grade < 3), run only on
# patients M1 flagged as having some toxicity. See hierarchical/predict.py.
# ==============================================================================

experiment:
  random_seed: 42
  prediction_output_dir: "M2/Prediction_results/train"

data:
  data_path_clean: "M2/dataset/train.xlsx"
  id_col: "ID"
  target_col: "Grade≥3"
  # 0 = Negative (Grade < 3), 1 = Positive (severe toxicity, Grade >= 3)
  drop_feature_enable: false

models:
  xgboost:
    drop_feature:
      - "number_nodules"
      - "extrahepatic_spread"
      - "smoking_status"
      - "BCLC"
      - "PS"
      - "cirrhosis"
      - "diabetes"
      - "portal_vein_thrombosis"
      - "ascites"
      - "antibiotics"
      - "encephalopathy"

    params:
      n_estimators: 500
      learning_rate: 0.02
      max_depth: 3
      subsample: 0.6
      colsample_bytree: 0.7
      reg_lambda: 2
      reg_alpha: 2
      min_child_weight: 10
      gamma: 1
      n_jobs: -1
      eval_metric: "aucpr"
      random_state: 42

training:
  cv:
    n_splits: 5
    shuffle: true
    random_state: 42

evaluation:
  ece:
    n_bins: 12
    strategy: "uniform"

  prob_thr: 0.5
  xgboost_model_path: "M2/Prediction_results/train/xgb_final_model.joblib"
  test_dataset_path: "M2/dataset/test.xlsx"

  do_calibration: false
  calib_method: "sigmoid"
  find_best_thr: true
  metric: "f1"
  thr_min: 0.30
  thr_max: 0.70
  thr_step: 0.01

  bootstrap:
    B: 1000
    random_state: 42

plots:
  figsize: [7, 6]
  dpi: 600
  class_names: ["Negative", "Positive"]
  axis_fontsize: 12
